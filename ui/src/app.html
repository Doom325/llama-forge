<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<style>
			/* System font stack */
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif,
					'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
				margin: 0;
				padding: 0;
				background-color: var(--color-bg-primary, #0f172a);
				color: var(--color-text-primary, #f8fafc);
				overflow-x: hidden;
			}
			noscript {
				display: block;
				padding: 2rem;
				text-align: center;
				background: #ef4444;
				color: white;
				font-weight: bold;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<noscript>LlamaForge Web UI requires JavaScript to run.</noscript>
		<div
			id="pre-hydration-skeleton"
			style="
				display: grid;
				grid-template-columns: var(--sidebar-width, 240px) 1fr;
				grid-template-rows: var(--header-height, 56px) 1fr;
				height: 100vh;
			"
		>
			<div
				class="skeleton-sidebar"
				style="
					grid-column: 1;
					grid-row: 1 / 3;
					background-color: var(--color-bg-secondary, #1e293b);
					border-right: 1px solid var(--color-border, #334155);
				"
			></div>
			<div
				class="skeleton-header"
				style="
					grid-column: 2;
					grid-row: 1;
					background-color: var(--color-bg-primary, #0f172a);
					border-bottom: 1px solid var(--color-border, #334155);
				"
			></div>
			<div class="skeleton-main" style="grid-column: 2; grid-row: 2; padding: 2rem"></div>
		</div>
		%sveltekit.body%
	</body>
</html>
