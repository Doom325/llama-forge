<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<style>
			/* System font stack */
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif,
					'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
				margin: 0;
				padding: 0;
				background-color: var(--color-bg-primary, #0f172a);
				color: var(--color-text-primary, #f8fafc);
				overflow-x: hidden;
			}
			/* Skeleton layout critical CSS */
			#app {
				display: grid;
				grid-template-columns: var(--sidebar-width, 240px) 1fr;
				grid-template-rows: var(--header-height, 56px) 1fr;
				height: 100vh;
			}
			.skeleton-sidebar {
				grid-column: 1;
				grid-row: 1 / 3;
				background-color: var(--color-bg-secondary, #1e293b);
				border-right: 1px solid var(--color-border, #334155);
			}
			.skeleton-header {
				grid-column: 2;
				grid-row: 1;
				background-color: var(--color-bg-primary, #0f172a);
				border-bottom: 1px solid var(--color-border, #334155);
			}
			.skeleton-main {
				grid-column: 2;
				grid-row: 2;
				padding: 2rem;
			}
			@media (max-width: 768px) {
				#app {
					grid-template-columns: var(--sidebar-collapsed-width, 64px) 1fr;
				}
			}
			@media (max-width: 640px) {
				#app {
					grid-template-columns: 1fr;
				}
				.skeleton-sidebar {
					display: none;
				}
				.skeleton-header {
					grid-column: 1;
				}
				.skeleton-main {
					grid-column: 1;
				}
			}
			noscript {
				display: block;
				padding: 2rem;
				text-align: center;
				background: #ef4444;
				color: white;
				font-weight: bold;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>LlamaForge Web UI requires JavaScript to run.</noscript>
		<div id="app">
			<div class="skeleton-sidebar"></div>
			<div class="skeleton-header"></div>
			<div class="skeleton-main">%sveltekit.body%</div>
		</div>
	</body>
</html>
