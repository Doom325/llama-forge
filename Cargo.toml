[workspace]
resolver = "2"
members = [
    "crates/llamaforge",
    "crates/llamaforge-config",
    "crates/llamaforge-proto",
    "crates/llamaforge-metrics",
    "crates/llamaforge-server-manager",
    "crates/llamaforge-types",
    "crates/llamaforge-queue",
]

[workspace.package]
version = "0.1.0-draft"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Doom325/llama-forge"

[workspace.dependencies]
serial_test = "3"
clap = { version = "4.5.61", features = ["derive", "env"] }
# Wired in as components land. Versions are pinned conservatively;
# bump deliberately, not opportunistically.
llamaforge-config = { path = "crates/llamaforge-config", version = "0.1.0-draft" }
llamaforge-metrics = { path = "crates/llamaforge-metrics", version = "0.1.0-draft" }
llamaforge-types = { path = "crates/llamaforge-types", version = "0.1.0-draft" }
llamaforge-queue = { path = "crates/llamaforge-queue", version = "0.1.0-draft" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
arc-swap = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nix = { version = "0.29", features = ["fs", "signal", "process"] }
tempfile = "3"
proptest = "1"
typed-builder = "0.20"
parking_lot = "0.12"
metrics = "0.24"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.0"
reqwest = { version = "0.12", features = ["json"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.7"
tower = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
deadpool-sqlite = "0.8"
deadpool-sync = "0.1.4"
deadpool = "0.12"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
metrics-exporter-prometheus = "0.16"
metrics-util = "0.18"
opentelemetry = "0.27"
bytes = "1"
futures-core = "0.3"
pin-project-lite = "0.2"
scopeguard = "1.2"
async-trait = "0.1"
tokio-stream = "0.1"
tracing-opentelemetry = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
