[workspace]
resolver = "2"
members = [
    "crates/llamaforge",
    "crates/llamaforge-config",
    "crates/llamaforge-proto",
    "crates/llamaforge-metrics",
]

[workspace.package]
version = "0.1.0-draft"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Doom325/llama-forge"

[workspace.dependencies]
# Wired in as components land. Versions are pinned conservatively;
# bump deliberately, not opportunistically.
llamaforge-config = { path = "crates/llamaforge-config" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
arc-swap = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nix = { version = "0.29", features = ["fs"] }
tempfile = "3"
proptest = "1"
typed-builder = "0.20"
parking_lot = "0.12"
metrics = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
