name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
        with:
          mold-version: 2.4.0
          make-default: true
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      
      - name: Format
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
        with:
          mold-version: 2.4.0
          make-default: true
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      - name: Build
        run: cargo build --workspace

      - name: Run Tests
        # `llamaforge-e2e` is excluded here because it runs in its own
        # `e2e-mocklama` job below — running the suite twice doubles
        # the wall-clock and lets a flaky parallel run on the same
        # process-global metrics DB hang the workspace job. The E2E
        # job alone is authoritative for the e2e tests.
        run: cargo test --workspace --exclude llamaforge-e2e --all-features

  e2e-mocklama:
    name: E2E (mock-llama)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
        with:
          mold-version: 2.4.0
          make-default: true
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `--tests` filters to test artifacts only, so it silently skips
      # mock-llama's `[[bin]]`. Build the binary explicitly first —
      # `Harness::start_full()` requires it on disk because the
      # composition root's `ServerManager` spawns mock-llama as a
      # subprocess via the configured `model_path`.
      - name: Build mock-llama binary
        run: cargo build --bin mock-llama
      - name: Build llamaforge binary
        run: cargo build --bin llamaforge
      - name: Build e2e harness
        run: cargo build -p llamaforge-e2e --tests

      - name: Run e2e tests
        run: cargo test -p llamaforge-e2e --tests -- --nocapture
