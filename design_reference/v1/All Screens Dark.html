<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LlamaForge — All screens (dark)</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--surface-0); color: var(--text-primary); }
    .mini { width: 100%; height: 100%; }
    .mini .Main > .pg-fill { flex: 1; min-height: 0; display: flex; }
    .mini .Main > .pg-fill > .PG { flex: 1; }
  </style>
</head>
<body data-theme="dark">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script type="text/babel" src="lf-core.jsx"></script>
  <script type="text/babel" src="lf-pages.jsx"></script>

  <script type="text/babel">
    const { useRef, useEffect, useState } = React;

    const MiniShell = ({ active, crumbs, children }) => (
      <div className="artboard-host mini" data-theme="dark" style={{ background: "var(--surface-0)", color: "var(--text-primary)" }}>
        <div className="AppShell">
          <Sidebar activeId={active} onNav={() => {}} collapsed={false} onToggle={() => {}} />
          <div className="Main">
            <TopBar crumbs={crumbs} conn="connected" connMeta="50051" />
            {children}
          </div>
        </div>
      </div>
    );

    // Scales a 1280×820 stage down to fit the thumb frame.
    const Thumb = ({ n, title, tag, children }) => {
      const frameRef = useRef(null);
      const [scale, setScale] = useState(0.34);
      useEffect(() => {
        const el = frameRef.current; if (!el) return;
        const fit = () => setScale(el.clientWidth / 1280);
        fit();
        const ro = new ResizeObserver(fit); ro.observe(el);
        return () => ro.disconnect();
      }, []);
      return (
        <div className="Thumb">
          <div className="tb-head">
            <span className="tb-n">{n}</span><span className="tb-t">{title}</span><span className="tb-tag">{tag}</span>
          </div>
          <div className="tb-frame" ref={frameRef}>
            <div className="tb-stage" style={{ transform: `scale(${scale})` }} aria-hidden="true">
              {children}
            </div>
          </div>
        </div>
      );
    };

    // ── WCAG contrast computation from the live dark tokens ──
    const lum = (r, g, b) => {
      const f = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
    };
    const parse = (s) => {
      const m = s.match(/rgba?\(([^)]+)\)/); if (!m) return [0, 0, 0];
      return m[1].split(",").slice(0, 3).map(x => parseFloat(x));
    };
    const ratio = (a, b) => {
      const [l1, l2] = [lum(...a), lum(...b)].sort((x, y) => y - x);
      return (l1 + 0.05) / (l2 + 0.05);
    };

    const ContrastChips = () => {
      const [chips, setChips] = useState([]);
      useEffect(() => {
        const probe = document.createElement("div");
        probe.setAttribute("data-theme", "dark");
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        const v = (name) => { probe.style.color = `var(${name})`; return parse(getComputedStyle(probe).color); };
        const pairs = [
          ["Body text", "--text-primary", "--surface-0"],
          ["Secondary", "--text-secondary", "--surface-1"],
          ["Accent", "--accent-blue", "--surface-0"],
          ["Healthy", "--status-healthy-fg", "--status-healthy-bg"],
          ["Degraded", "--status-degraded-fg", "--status-degraded-bg"],
          ["Failed", "--status-failed-fg", "--status-failed-bg"],
        ];
        setChips(pairs.map(([label, fg, bg]) => {
          const r = ratio(v(fg), v(bg));
          return { label, r: r.toFixed(2), pass: r >= 4.5 };
        }));
        document.body.removeChild(probe);
      }, []);
      return (
        <div className="CChips">
          {chips.map(c => (
            <span className="CChip" key={c.label}>{c.label} <b>{c.r}:1</b> {c.pass ? "✓" : "⚠"}</span>
          ))}
        </div>
      );
    };

    const VRow = ({ t, d, children }) => (
      <div className="VRow">
        <span className="vc"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg></span>
        <div><div className="vt">{t}</div><div className="vd">{d}{children}</div></div>
      </div>
    );

    const FLEET_NONE = () => null;

    const App = () => (
      <div className="Gallery" data-theme="dark">
        <h1>All screens · dark theme</h1>
        <p className="lead">The seven primary LlamaForge screens rendered live in dark theme, plus an accessibility verification pass.</p>

        <div className="ThumbGrid">
          <Thumb n="01" title="Dashboard" tag="loaded">
            <MiniShell active="dashboard" crumbs={[{ label: "Dashboard" }]}><DashboardPage theme="dark" onOpenServer={() => {}} /></MiniShell>
          </Thumb>
          <Thumb n="02" title="Server Detail" tag="healthy">
            <MiniShell active="servers" crumbs={[{ label: "Dashboard" }, { label: "Servers" }, { label: "llama-70b-gpu0", mono: true }]}><ServerDetailPage state="healthy" theme="dark" /></MiniShell>
          </Thumb>
          <Thumb n="03" title="Queue Inspector" tag="7 queued">
            <MiniShell active="queue" crumbs={[{ label: "Queue" }]}><QueuePage /></MiniShell>
          </Thumb>
          <Thumb n="04" title="Request Explorer" tag="browser">
            <MiniShell active="explorer" crumbs={[{ label: "Explorer" }]}><ExplorerPage /></MiniShell>
          </Thumb>
          <Thumb n="05" title="Configuration" tag="validation error">
            <MiniShell active="configuration" crumbs={[{ label: "Configuration" }]}><PriorityRulesPage initialEdit={0} initialDraft={{ weight: 1500 }} /></MiniShell>
          </Thumb>
          <Thumb n="06" title="Playground" tag="streaming">
            <MiniShell active="playground" crumbs={[{ label: "Playground" }]}><div className="pg-fill"><PlaygroundPage state="streaming" /></div></MiniShell>
          </Thumb>
          <Thumb n="07" title="Model Registry" tag="4 models">
            <MiniShell active="models" crumbs={[{ label: "Models" }]}>
              <div className="Page"><div className="PageInner">
                <div className="DashHead" style={{ marginBottom: 16 }}><div className="titlewrap"><div className="titlerow"><h1 style={{ font: "var(--weight-semibold) 22px var(--font-sans)", margin: 0 }}>Model Registry</h1></div><div className="sub">4 models loaded across 4 servers</div></div></div>
                <RegistryGrid models={[
                  { name: "Llama 3.1 70B", quant: "Q4_K_M", ctx: "4096", server: "llama-70b-gpu0", status: "healthy", tps: "42", p50: "38", vram: "18.2" },
                  { name: "Llama 3.1 8B", quant: "Q8_0", ctx: "8192", server: "llama-8b-gpu1", status: "healthy", tps: "85", p50: "22", vram: "8.5" },
                  { name: "CodeLlama 34B", quant: "Q5_K_M", ctx: "4096", server: "codellama-gpu2", status: "degraded", tps: "12", p50: "180", vram: "22.1", tpsWarn: true, p50Warn: true },
                  { name: "Mistral 7B", quant: "Q4_K_M", ctx: "4096", server: "mistral-gpu3", status: "failed", tps: null, p50: null, vram: null },
                ]} onOpenServer={() => {}} />
              </div></div>
            </MiniShell>
          </Thumb>
        </div>

        <div className="Verify">
          <h2><Icon name="check" size={16} /> Accessibility verification — dark theme</h2>
          <div className="vgrid">
            <VRow t="Text contrast ≥ 4.5:1" d="Measured live against the dark tokens — every text/surface pair clears WCAG AA:">
              <ContrastChips />
            </VRow>
            <VRow t="Status colors distinguishable" d="Healthy/degraded/failed never rely on hue alone — each badge pairs color with a fixed glyph (✓ ⚠ ✕ ⟳) and text label, so they read in deuteranopia and grayscale." />
            <VRow t="Charts use the dark-friendly palette" d="ECharts axis/grid/tooltip colors switch with theme (slate grid, lighter axis labels); series colors keep ≥3:1 against the dark plot background." />
            <VRow t="Focus rings visible on dark" d="The 2px focus ring uses --focus-ring at a fixed offset; it sits above both surface-0 and surface-1 and is never suppressed." />
          </div>
        </div>
      </div>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
