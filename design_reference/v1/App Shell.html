<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LlamaForge — App Shell</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Canvas-local: artboards wrap the AppShell at viewport dimensions.
       Each artboard is its own theme root so light/dark sit side-by-side. */
    .artboard-host {
      width: 100%; height: 100%;
      background: var(--surface-0);
      color: var(--text-primary);
    }
    .artboard-host[data-theme="dark"] { color-scheme: dark; }

    /* Lead caption above sections, in canvas chrome */
    .CanvasIntro {
      max-width: 760px;
      margin: 24px auto 0;
      padding: 0 24px 8px;
      font: var(--weight-regular) 13px var(--font-sans);
      color: var(--text-secondary);
    }
    .CanvasIntro h1 {
      margin: 0 0 6px; font: var(--weight-semibold) 22px var(--font-sans);
      letter-spacing: -0.015em; color: var(--text-primary);
    }
    .CanvasIntro p { margin: 0; }
    .CanvasIntro kbd {
      font: 11px var(--font-mono); padding: 1px 5px; border-radius: 3px;
      background: var(--surface-2); border: 1px solid var(--border-default);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="lf-core.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    // Wrap AppShell inside an artboard-host that applies its own theme.
    const Artboard = ({ theme, collapsed }) => (
      <div className="artboard-host" data-theme={theme}>
        <AppShell initialCollapsed={collapsed} />
      </div>
    );

    const App = () => (
      <DesignCanvas>
        <DCSection
          id="desktop"
          title="Desktop · 1440 × 900"
          subtitle="Full sidebar (240px) + content. Dashboard active — note the left accent stripe and subtle blue surface on the active item. Click any nav item or the collapse toggle in the sidebar footer to try the 160 ms transition."
        >
          <DCArtboard id="desktop-light" label="Light · expanded" width={1440} height={900}>
            <Artboard theme="light" collapsed={false} />
          </DCArtboard>
          <DCArtboard id="desktop-dark" label="Dark · expanded" width={1440} height={900}>
            <Artboard theme="dark" collapsed={false} />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="medium"
          title="Medium · 1024 × 768"
          subtitle="Auto-collapsed sidebar (64px, icons only). Active item keeps its accent stripe and surface tint; labels appear as tooltips on hover. Full content width still fits the 1400 px max."
        >
          <DCArtboard id="medium-light" label="Light · collapsed" width={1024} height={768}>
            <Artboard theme="light" collapsed={true} />
          </DCArtboard>
          <DCArtboard id="medium-dark" label="Dark · collapsed" width={1024} height={768}>
            <Artboard theme="dark" collapsed={true} />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="anatomy"
          title="Anatomy"
          subtitle="Each region called out — sidebar nav, brand block, footer toggle; topbar breadcrumb + connection badge + help. Open this artboard in focus mode for a closer look."
        >
          <DCArtboard id="anatomy-light" label="Annotated · light" width={1440} height={900}>
            <div className="artboard-host" data-theme="light" style={{ position: "relative" }}>
              <AppShell initialCollapsed={false} />
              {/* Callouts overlay */}
              <Callouts />
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    // Annotation overlay for the anatomy artboard
    const Callouts = () => {
      const dots = [
        { x: 8,   y: 24,  to: 220, label: "1 · Brand + version", desc: "LF monogram, product name, semver. Collapses to mark only." },
        { x: 8,   y: 200, to: 220, label: "2 · Primary nav",     desc: "7 destinations. Active item: accent stripe + tinted surface + medium weight." },
        { x: 8,   y: 830, to: 220, label: "3 · Collapse toggle", desc: "Footer button. 160 ms ease-out width transition. ⌘\\ shortcut." },
        { x: 252, y: 24,  to: 600, label: "4 · Breadcrumb",      desc: "Trail starts at the top-level section. Server detail pages append the server id (mono)." },
        { x: 1170,y: 24,  to: 1180,label: "5 · Connection status", desc: "Connected · Reconnecting… · Disconnected. Pulse dot when live." },
        { x: 1380,y: 24,  to: 1380,label: "6 · Help",            desc: "Keyboard shortcuts overlay (? glyph)." },
      ];
      return (
        <svg style={{
          position: "absolute", inset: 0, width: "100%", height: "100%",
          pointerEvents: "none", zIndex: 4
        }} viewBox="0 0 1440 900" preserveAspectRatio="none">
          {dots.map((d, i) => (
            <g key={i}>
              <circle cx={d.x} cy={d.y} r="9" fill="var(--accent-blue)" opacity="0.16"/>
              <circle cx={d.x} cy={d.y} r="5" fill="var(--accent-blue)"/>
              <text x={d.x} y={d.y + 1.5} fontFamily="var(--font-mono)" fontWeight="700"
                    fontSize="7" fill="#fff" textAnchor="middle">{i + 1}</text>
            </g>
          ))}
        </svg>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
