[package]
name = "llamaforge-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Inherited from workspace. This crate is the merged successor of the
# former `llamaforge-transport`, `llamaforge-adapters`, and
# `llamaforge-dispatch` crates (see PLAN.md Phase 9 PR3 and design doc
# §4.2 + §7). The dependency union covers all three.
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tonic = { workspace = true, features = ["tls-native-roots", "gzip"] }
tonic-health = "0.13"
tonic-reflection = { workspace = true, optional = true }
hyper.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-stream.workspace = true
uuid.workspace = true
pin-project-lite.workspace = true
futures-core.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
metrics = "0.24"
metrics-exporter-prometheus.workspace = true
reqwest = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
chrono.workspace = true

# Component dependencies. llamaforge-core and llamaforge-metrics are
# direct deps despite the hexagonal port-trait convention because the
# composition root needs access to their concrete reader/store types,
# and the merged api crate is now a composition-root neighbour itself.
llamaforge-core.workspace = true
llamaforge-metrics.workspace = true
llamaforge-server.workspace = true
llamaforge-proto.workspace = true
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true

[features]
default = ["dev-reflection"]
# Enables the gRPC reflection service (`tonic-reflection`). Useful for
# `grpcurl` and similar SDK-less probing. Documented in
# `docs/component-designs/07_TRANSPORT_LAYER.md` as dev-only — the
# default cargo build pulls it in so `cargo run` + `grpcurl` works
# out of the box. Production deployments that want a smaller surface
# can build with `--no-default-features`.
dev-reflection = ["dep:tonic-reflection"]

[dev-dependencies]
chrono.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
proptest = { workspace = true }
serial_test.workspace = true
llamaforge-core = { workspace = true, features = ["test-utils"] }
llamaforge-metrics = { workspace = true, features = ["test-utils", "test-fixtures"] }

# Integration test targets. The three predecessor crates each had tests
# at the top level of tests/; after the merge they live under
# tests/transport/ and tests/dispatch/ (PLAN.md PR3 task 3.2). Cargo
# only auto-discovers tests at tests/*.rs, so nested files need
# explicit [[test]] entries. Names are prefixed with the old crate
# name to disambiguate the two design_doc_tests.rs files.

[[test]]
name = "api_transport_design_doc_tests"
path = "tests/transport/design_doc_tests.rs"

[[test]]
name = "api_transport_vc3"
path = "tests/transport/vc3_transport.rs"

[[test]]
name = "api_dispatch_design_doc_tests"
path = "tests/dispatch/design_doc_tests.rs"

[[test]]
name = "api_dispatch_proptest"
path = "tests/dispatch/proptest_dispatch.rs"

[[test]]
name = "api_dispatch_proxy_tests"
path = "tests/dispatch/proxy_tests.rs"

[[test]]
name = "api_dispatch_reconciliation"
path = "tests/dispatch/reconciliation_tests.rs"

[[test]]
name = "api_dispatch_stress"
path = "tests/dispatch/stress.rs"

[[test]]
name = "api_dispatch_vc3_pipeline"
path = "tests/dispatch/vc3_dispatch_pipeline.rs"
