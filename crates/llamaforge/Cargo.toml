[package]
name = "llamaforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LlamaForge — orchestrator and gateway for fleets of llama.cpp servers."

[[bin]]
name = "llamaforge"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
anyhow = "1"
uuid = { workspace = true }
llamaforge-config = { workspace = true }
llamaforge-types = { workspace = true }
llamaforge-metrics = { workspace = true }
llamaforge-server-manager = { workspace = true }
llamaforge-routing = { workspace = true }
llamaforge-dispatch = { workspace = true }
llamaforge-queue = { workspace = true }
llamaforge-transport = { workspace = true }
llamaforge-adapters = { workspace = true }
