[package]
name = "llamaforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LlamaForge — orchestrator and gateway for fleets of llama.cpp servers."

[lib]
path = "src/lib.rs"

[[bin]]
name = "llamaforge"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
anyhow = "1"
uuid = { workspace = true }
llamaforge-core = { workspace = true }
llamaforge-metrics = { workspace = true }
llamaforge-server = { workspace = true }
llamaforge-api = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
metrics.workspace = true
serde_json.workspace = true

[features]
telemetry-nvml = ["llamaforge-server/telemetry-nvml"]
telemetry-amdgpu = ["llamaforge-server/telemetry-amdgpu"]

[dev-dependencies]
tempfile = { workspace = true }
