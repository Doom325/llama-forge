[package]
name = "llamaforge-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace-level end-to-end tests for LlamaForge against mock-llama."

[lib]
path = "src/lib.rs"

[dependencies]
mock-llama = { workspace = true }
llamaforge-config = { workspace = true, features = ["test-utils"] }
llamaforge-types = { workspace = true }
llamaforge-metrics = { workspace = true }
llamaforge-server-manager = { workspace = true }
llamaforge-routing = { workspace = true }
llamaforge-dispatch = { workspace = true }
llamaforge-queue = { workspace = true }
llamaforge-transport = { workspace = true }
llamaforge-adapters = { workspace = true }
llamaforge = { workspace = true }
llamaforge-proto = { workspace = true }
futures-util = { workspace = true }
tonic = { workspace = true }
tonic-reflection = "0.13"
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = "1"
tempfile = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
llamaforge-config = { workspace = true, features = ["test-utils"] }
