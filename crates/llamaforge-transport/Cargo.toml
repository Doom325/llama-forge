[package]
name = "llamaforge-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Inherited from workspace
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tonic = { workspace = true, features = ["tls-native-roots", "gzip"] }
tonic-health = "0.13"
tonic-reflection = { workspace = true, optional = true }
hyper.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-stream.workspace = true
uuid.workspace = true
pin-project-lite.workspace = true
futures-core.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
metrics = "0.24"

# Dependency rationale: llamaforge-core and llamaforge-metrics are direct dependencies
# despite cross-crate communication being via port traits because we need access to their
# respective ConfigReader and MetricsExporter implementations to wire them in the composition root
# and use their public interface definitions.
llamaforge-core.workspace = true
llamaforge-metrics.workspace = true
llamaforge-proto.workspace = true
chrono.workspace = true
tokio-util.workspace = true

[features]
default = ["dev-reflection"]
# Enables the gRPC reflection service (`tonic-reflection`). Useful for
# `grpcurl` and similar SDK-less probing. Documented in
# `docs/component-designs/07_TRANSPORT_LAYER.md` as dev-only — the
# default cargo build pulls it in so `cargo run` + `grpcurl` works
# out of the box. Production deployments that want a smaller surface
# can build with `--no-default-features`.
dev-reflection = ["dep:tonic-reflection"]

[dev-dependencies]
chrono.workspace = true
# reqwest: used for full-stack integration tests (real HTTP client -> real server).
# Unit/handler tests use axum::test helpers instead.
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
tower = { workspace = true, features = ["util"] }
llamaforge-core = { workspace = true, features = ["test-utils"] }
llamaforge-metrics = { workspace = true, features = ["test-fixtures"] }
serial_test.workspace = true

[build-dependencies]
