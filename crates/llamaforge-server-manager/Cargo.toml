[package]
name = "llamaforge-server-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
llamaforge-core = { workspace = true }
llamaforge-metrics = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "sync", "signal", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }
tokio-util = { workspace = true }
metrics = { workspace = true }
chrono = { workspace = true }
rand = "0.8"
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `tests/config_tests.rs` spawns `mock-llama` as a subprocess via
# `env!("CARGO_BIN_EXE_mock-llama")`; Cargo only sets that env var when
# the test crate has a (dev-)dep on the bin's package.
mock-llama = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
typed-builder = { workspace = true }
metrics-util = { workspace = true, features = ["debugging"] }
serial_test = { workspace = true }

[features]
test-utils = ["dep:axum", "dep:tower"]
telemetry-nvml = ["dep:nvml-wrapper"]
telemetry-amdgpu = []

[dependencies.nvml-wrapper]
workspace = true
optional = true

[dependencies.axum]
workspace = true
optional = true

[dependencies.tower]
workspace = true
optional = true
