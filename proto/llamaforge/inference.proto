syntax = "proto3";

package llamaforge.inference;

service InferenceService {
  rpc StreamInference (InferenceRequest) returns (stream InferenceResponse);
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message InferenceRequest {
  string model = 1;
  repeated ChatMessage messages = 2;
  optional uint32 max_tokens = 3;
  optional float temperature = 4;
  bool stream = 5;
  map<int32, double> logit_bias = 6;
  string tools = 7; // JSON-encoded tools array
  string tool_choice = 8; // JSON-encoded tool_choice object
}

message InferenceResponse {
  string payload = 1; // JSON-encoded ChatCompletionChunk
}
